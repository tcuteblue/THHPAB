<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>個人雲帳本</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="個人雲帳本">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #F2F5F8;
            --text-color: #2F3640;
            --primary: #00A8FF;       /* 亮藍色 (正數/收入) */
            --primary-dark: #0082C8;
            --expense: #FF4757;       /* 亮紅色 (負數/支出) */
            --income: #20BF6B;        /* 翠綠色 (預算/結餘) */
            --transfer: #A55EEA;      /* 亮紫色 (轉帳) */
            --border: #DFE4EA;
            --header-bg: linear-gradient(135deg, #F39C12, #E67E22); 
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; user-select: none; -webkit-user-select: none; font-size: 20px; }
        input, textarea, select { user-select: auto; -webkit-user-select: auto; font-size: 20px !important; }

        @media all and (display-mode: standalone) { #install-btn { display: none !important; } }

        header { background: var(--header-bg); color: #fff; padding: 22px 20px; font-size: 24px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(230,126,34,.3); position: sticky; top: 0; z-index: 101; border-radius: 0 0 24px 24px; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,0.15); }
        .header-actions { display: flex; gap: 10px; }
        .btn-action { background: rgba(255,255,255,0.25); border: none; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: background 0.2s; text-shadow: none; }
        .btn-action:active { background: rgba(255,255,255,0.4); }
        
        .container { padding: 16px; padding-bottom: 120px; }
        
        .card-panel { background: #fff; border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,.06); }
        .month-header { font-size: 28px; font-weight: 900; text-align: center; color: var(--text-color); display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
        .month-header span { cursor: pointer; padding: 5px 15px; border-radius: 12px; transition: background 0.2s; }
        .month-header span:active { background: #f1f2f6; }
        
        .week-calendar { display: flex; justify-content: space-between; border-top: 1px solid #f1f2f6; padding-top: 18px; margin-top: 10px; touch-action: pan-y; }
        .day-col { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 16px; color: #7f8fa6; font-weight: bold; cursor: pointer; position: relative; }
        .day-date { width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 20px; margin-top: 8px; color: var(--text-color); transition: all 0.2s; }
        .day-today .day-date { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(0,168,255,.4); }
        .day-has-record { width: 8px; height: 8px; border-radius: 50%; background: var(--expense); position: absolute; bottom: -12px; display: none; }
        .day-col.has-record .day-has-record { display: block; }
        .day-col:active .day-date { background: #eef7fc; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-top: 30px; }
        .dash-item { cursor: pointer; padding: 10px 4px; border-radius: 12px; transition: background 0.2s; }
        .dash-item:active { background: #f8f9fa; }
        .dash-label { font-size: 15px; color: #7f8fa6; font-weight: 900; margin-bottom: 8px; display: block; }
        .dash-value { font-size: 24px; font-weight: 900; }
        
        .t-exp { color: var(--expense); } 
        .t-inc { color: var(--primary); } 
        .t-bal { color: var(--income); }

        .action-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 35px; }
        .btn-main { padding: 16px 4px; border-radius: 20px; font-size: 18px; font-weight: 900; border: none; color: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; transition: all .1s; letter-spacing: 1px; }
        
        .btn-record { grid-column: span 1; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 6px 0 #0073B0, 0 8px 20px rgba(0,168,255,.3); }
        .btn-record:active { transform: translateY(6px); box-shadow: 0 0 0 #0073B0; }
        
        .btn-acc { grid-column: span 1; font-size: 16px; gap: 4px; background: linear-gradient(135deg, #1DD1A1, #10AC84); box-shadow: 0 6px 0 #0D8C6B, 0 8px 20px rgba(29,209,161,.3); }
        .btn-acc:active { transform: translateY(6px); box-shadow: 0 0 0 #0D8C6B; }
        
        .btn-chart { grid-column: span 1; font-size: 16px; gap: 4px; background: linear-gradient(135deg, #9C88FF, #8C7AE6); box-shadow: 0 6px 0 #7158E2, 0 8px 20px rgba(156,136,255,.3); }
        .btn-chart:active { transform: translateY(6px); box-shadow: 0 0 0 #7158E2; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #fff; border-radius: 18px; padding: 14px 15px; box-shadow: 0 4px 10px rgba(0,0,0,.05); cursor: pointer; transition: all 0.1s; border: 2px solid transparent; }
        .stat-box:active { transform: scale(0.97); border-color: var(--primary); background: #fdfefe; }
        .stat-title { font-size: 16px; font-weight: 900; color: #34495e; border-bottom: 1px solid #f1f2f6; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end; }
        .stat-date { font-size: 13px; color: #95a5a6; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 900; margin-bottom: 4px; }

        .list-header { font-size: 20px; font-weight: 900; color: #2F3640; margin: 25px 5px 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 明細卡片：採用 Flexbox 上下分層排版 */
        .record-item { background: #fff; border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.05); border-left: 8px solid transparent; display: flex; flex-direction: column; }
        .record-item.exp { border-left-color: var(--expense); }
        .record-item.inc { border-left-color: var(--primary); }
        .record-item.tra { border-left-color: var(--transfer); }
        
        /* 頂部區域：日期與刪除按鈕 */
        .r-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .r-date { font-size: 14px; color: #95a5a6; font-weight: 900; }
        .del-btn { background: #ffefef; color: var(--expense); border: none; border-radius: 10px; padding: 6px 14px; font-size: 14px; font-weight: 900; cursor: pointer; }
        .del-btn:active { background: #ffdada; }
        
        /* 內容區域：分類、備註、金額 */
        .r-cat { font-size: 19px; font-weight: 900; color: #2F3640; line-height: 1.4; word-break: break-word; }
        .r-sub { font-size: 15px; color: #7f8fa6; margin-top: 4px; font-weight: bold; line-height: 1.4; word-break: break-word; }
        .r-amt { font-size: 24px; font-weight: 900; font-family: monospace; letter-spacing: 1px; margin-top: 8px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 1000; overflow-y: auto; animation: fadeIn .25s cubic-bezier(0.1, 0.9, 0.2, 1); padding-bottom: 120px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .m-header { padding: 22px; background: var(--header-bg); color: #fff; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 15px rgba(230,126,34,.3); border-radius: 0 0 24px 24px; margin-bottom: 25px; font-weight: 900; font-size: 22px; text-shadow: 0 1px 2px rgba(0,0,0,0.15); }
        .m-close { background: rgba(255,255,255,0.25); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; text-shadow: none; }

        .form-group { padding: 0 20px; margin-bottom: 22px; }
        .form-group label { display: block; font-size: 18px; font-weight: 900; color: #34495e; margin-bottom: 10px; }
        .form-row { display: flex; gap: 14px; }
        select, input[type="text"], input[type="date"], input[type="number"], input[type="month"] { width: 100%; padding: 16px 18px; border: 2px solid var(--border); border-radius: 16px; font-size: 20px; background: #fff; font-weight: 800; color: var(--text-color); appearance: none; transition: all .2s; }
        select:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,168,255,.15); }
        
        .tabs { display: flex; background: #fff; border-radius: 18px; padding: 8px; margin: 0 20px 25px; box-shadow: 0 4px 12px rgba(0,0,0,.06); gap: 6px; }
        .tab { flex: 1; text-align: center; padding: 14px; font-size: 18px; font-weight: 900; color: #7f8fa6; border-radius: 14px; cursor: pointer; transition: all 0.2s; background: #F8F9FA; }
        .tab.active.exp { background: var(--expense); color: #fff; box-shadow: 0 4px 12px rgba(255,71,87,.4); }
        .tab.active.inc { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(0,168,255,.4); } 
        .tab.active.tra { background: var(--transfer); color: #fff; box-shadow: 0 4px 12px rgba(165,94,234,.4); }
        .tab.active.tot { background: var(--income); color: #fff; box-shadow: 0 4px 12px rgba(32,191,107,.4); } 

        .amt-box { background: #fff; margin: 0 20px 25px; padding: 25px; border-radius: 22px; text-align: right; box-shadow: 0 5px 15px rgba(0,0,0,.08); border: 2px solid transparent; transition: all .2s; }
        .amt-box.active { border-color: var(--primary); background: #fdfefe; box-shadow: 0 0 0 5px rgba(0,168,255,.2); }
        .amt-val { font-size: 52px; font-weight: 900; font-family: monospace; letter-spacing: 1px; color: var(--text-color); }
        .bal-hint { font-size: 16px; margin-top: 10px; text-align: right; font-weight: 900; }

        .btn-save { background: var(--primary); color: #fff; width: calc(100% - 40px); margin: 20px; padding: 20px; border-radius: 22px; font-size: 24px; font-weight: 900; border: none; box-shadow: 0 6px 0 var(--primary-dark), 0 8px 20px rgba(0,168,255,.3); cursor: pointer; }
        .btn-save:active { transform: translateY(6px); box-shadow: 0 0 0 var(--primary-dark); }

        .autocomplete-list { display: none; position: absolute; top: calc(100% + 5px); left: 20px; right: 20px; background: #fff; border: 2px solid var(--primary); border-radius: 14px; z-index: 100; max-height: 200px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,.15); }
        .ac-item { padding: 14px 18px; border-bottom: 1px solid #f1f2f6; font-size: 18px; font-weight: 900; color: #2F3640; cursor: pointer; }
        .ac-item:active { background: #eef7fc; }
        .ac-item:last-child { border-bottom: none; }

        #v-keypad { position: fixed; bottom: 0; left: 0; width: 100%; background: #DFE4EA; padding: 15px 15px 40px 15px; display: none; grid-template-columns: repeat(4, 1fr); gap: 12px; z-index: 1500; box-shadow: 0 -10px 40px rgba(0,0,0,.2); border-radius: 30px 30px 0 0; }
        .key { background: #fff; border: none; padding: 22px 0; font-size: 28px; font-weight: 900; color: #2F3640; border-radius: 18px; box-shadow: 0 5px 0 #CED6E0; cursor: pointer; }
        .key:active { box-shadow: 0 0 0 #CED6E0; transform: translateY(5px); background: #f1f2f6; }
        .key-op { background: #CED6E0; color: #2F3640; font-size: 24px; box-shadow: 0 5px 0 #A4B0BE; }
        .key-act { background: var(--primary); color: #fff; box-shadow: 0 5px 0 var(--primary-dark); font-size: 24px; grid-row: span 2; display: flex; align-items: center; justify-content: center; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(47,54,64,.95); color: #fff; padding: 16px 30px; border-radius: 30px; font-size: 18px; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9999; box-shadow: 0 6px 20px rgba(0,0,0,.25); white-space: nowrap; }
        
        .search-bar { background: #fff; padding: 14px 20px; position: sticky; top: 75px; z-index: 9; border-bottom: 1px solid #f1f2f6; box-shadow: 0 4px 10px rgba(0,0,0,.03); }
        .search-bar input { padding-left: 45px; background: #f8f9fa url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="%2395a5a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 14px center; border-radius: 18px; }

        .btn-float { position: fixed; bottom: 30px; right: 30px; width: 66px; height: 66px; border-radius: 33px; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.15); display: flex; justify-content: center; align-items: center; font-size: 30px; cursor: pointer; z-index: 100; border: none; color: #2F3640; transition: transform 0.2s; }
        .btn-float:active { transform: scale(0.9); }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 15px 20px; text-align: center; font-weight: 900; }
        .cal-head { color: #7f8fa6; font-size: 16px; padding-bottom: 12px; }
        .cal-cell { padding: 14px 0; border-radius: 14px; cursor: pointer; transition: background 0.2s; font-size: 20px; position: relative; }
        .cal-cell:active { background: #f1f2f6; }
        .cal-cell.has-rec::after { content: ''; display: block; width: 8px; height: 8px; background: var(--expense); border-radius: 50%; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); }
        .cal-cell.today { background: var(--primary); color: #fff; }

        .mgr-card { background: #fff; border-radius: 18px; padding: 18px; margin: 0 20px 18px; box-shadow: 0 3px 10px rgba(0,0,0,.05); border: 2px solid #f1f2f6; }
        .mgr-title { font-size: 20px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #2c3e50; }
        .mgr-chip { display: inline-flex; align-items: center; background: #f8f9fa; padding: 10px 14px; border-radius: 12px; font-size: 16px; font-weight: bold; margin: 0 10px 10px 0; border: 1px solid #eee; }
        .mgr-del { margin-left: 10px; color: var(--expense); cursor: pointer; font-weight: 900; font-size: 18px; }
        
        .btn-big-action { width: calc(100% - 40px); margin: 0 20px 18px; padding: 18px; border-radius: 18px; font-size: 20px; font-weight: 900; border: none; cursor: pointer; text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; }
    </style>
</head>

<body>
    <div id="toast">提示訊息</div>

    <header>
        <div>☁️ 個人雲帳本</div>
        <div class="header-actions">
            <button class="btn-action" onclick="openGlobalSearch()">🔍 搜尋</button>
            <button class="btn-action" onclick="syncToGAS(true)" id="btn-sync">🔄 同步</button>
        </div>
    </header>

    <div class="container">
        <!-- 首頁儀表板 -->
        <div class="card-panel">
            <div class="month-header">
                <span onclick="chgMth(-1)">◀</span>
                <span id="txt-month" onclick="openCalPicker()"></span>
                <span onclick="chgMth(1)">▶</span>
            </div>
            
            <div style="font-size:14px; color:#95a5a6; text-align:center; font-weight:bold; margin-bottom: 5px;">左右滑動切換週次</div>
            <div class="week-calendar" id="ui-calendar"></div>

            <div class="dashboard">
                <div class="dash-item" onclick="openChart('income')"><span class="dash-label">本月收入</span><span class="dash-value t-inc" id="d-inc">0</span></div>
                <div class="dash-item" onclick="openChart('expense')" style="border-left: 2px solid #f1f2f6; border-right: 2px solid #f1f2f6;"><span class="dash-label">本月支出</span><span class="dash-value t-exp" id="d-exp">0</span></div>
                <div class="dash-item" onclick="openChart('total')"><span class="dash-label">本月預算</span><span class="dash-value t-bal" id="d-bal">0</span></div>
            </div>
        </div>

        <!-- 記帳、帳戶、圖表分析 三大按鈕區塊 -->
        <div class="action-grid">
            <button class="btn-main btn-record" onclick="openRecord()">➕ 記帳</button>
            <button class="btn-main btn-acc" onclick="openAccMgr()">💳 帳戶</button>
            <button class="btn-main btn-chart" onclick="openChart('expense')">📊 分析</button>
        </div>

        <!-- 統計區塊 -->
        <div class="stats-grid">
            <div class="stat-box" onclick="openList('today')">
                <div class="stat-title">本日 <span class="stat-date" id="s-d-today"></span></div>
                <div class="stat-row"><span>收入</span><span class="t-inc" id="s-i-today">0</span></div>
                <div class="stat-row"><span>支出</span><span class="t-exp" id="s-e-today">0</span></div>
            </div>
            <div class="stat-box" onclick="openList('week')">
                <div class="stat-title">本週 <span class="stat-date" id="s-d-week"></span></div>
                <div class="stat-row"><span>收入</span><span class="t-inc" id="s-i-week">0</span></div>
                <div class="stat-row"><span>支出</span><span class="t-exp" id="s-e-week">0</span></div>
            </div>
            <div class="stat-box" onclick="openList('month')">
                <div class="stat-title">本月 <span class="stat-date" id="s-d-month"></span></div>
                <div class="stat-row"><span>收入</span><span class="t-inc" id="s-i-month">0</span></div>
                <div class="stat-row"><span>支出</span><span class="t-exp" id="s-e-month">0</span></div>
            </div>
            <div class="stat-box" onclick="openList('year')">
                <div class="stat-title">本年 <span class="stat-date" id="s-d-year"></span></div>
                <div class="stat-row"><span>收入</span><span class="t-inc" id="s-i-year">0</span></div>
                <div class="stat-row"><span>支出</span><span class="t-exp" id="s-e-year">0</span></div>
            </div>
        </div>

        <div class="list-header">
            <span id="ui-inline-title">📝 本日明細</span>
        </div>
        <div id="ui-today-list"></div>
        
        <button class="btn-main btn-record" id="install-btn" style="background:var(--income); box-shadow:0 6px 0 #189855; margin-top:25px; font-size:18px; width:100%;" onclick="handleInstall()">📱 將帳本加到手機主畫面</button>
    </div>

    <button class="btn-float" onclick="openSettings()">⚙️</button>

    <!-- ===== 記帳 Modal ===== -->
    <div id="m-record" class="modal">
        <div class="m-header"><span>新增紀錄</span><button class="m-close" onclick="closeModal()">✖</button></div>
        
        <div class="tabs" id="r-tabs">
            <div class="tab active exp" data-t="expense">支出</div>
            <div class="tab inc" data-t="income">收入</div>
            <div class="tab tra" data-t="transfer">轉帳</div>
        </div>

        <div class="amt-box" id="r-amt-box" onclick="openKeypad()">
            <div style="font-size:16px; color:#95a5a6; font-weight:900; margin-bottom:8px;">點擊輸入金額</div>
            <div class="amt-val" id="r-amt">0</div>
        </div>

        <div id="r-area-cat" class="form-row form-group">
            <div style="flex:1"><label>主分類</label><select id="r-mcat" onchange="loadSubCat()"></select></div>
            <div style="flex:1"><label>子分類</label><select id="r-scat" onchange="checkNewCat(this)"></select></div>
        </div>
        
        <div id="r-area-tra" class="form-row form-group" style="display:none;">
            <div style="flex:1"><label>轉出帳戶</label><select id="r-acc-out"></select></div>
            <div style="flex:1"><label>轉入帳戶</label><select id="r-acc-in"></select></div>
        </div>

        <div class="form-row form-group">
            <div style="flex:1"><label>日期</label><input type="date" id="r-date"></div>
            <div style="flex:1" id="r-acc-container">
                <label>帳戶</label><select id="r-acc" onchange="updBal()"></select>
                <div class="bal-hint" id="r-bal">餘額: $0</div>
            </div>
        </div>
        <div class="form-group" style="position:relative;">
            <label>備註 (選填)</label>
            <input type="text" id="r-note" placeholder="寫點什麼..." oninput="handleNoteInput(this.value)">
            <div id="note-sugg" class="autocomplete-list"></div>
        </div>
        <button class="btn-save" onclick="saveRec()">💾 儲存紀錄</button>
    </div>

    <!-- ===== 列表與搜尋 Modal ===== -->
    <div id="m-list" class="modal">
        <div class="m-header"><span id="l-title">歷史明細</span><button class="m-close" onclick="closeModal()">✖</button></div>
        <div class="search-bar"><input type="text" id="l-search" placeholder="搜尋分類、金額、備註..." oninput="renderListModal()"></div>
        <div style="padding: 15px;" id="l-container"></div>
    </div>

    <!-- ===== 月曆選擇器 Modal ===== -->
    <div id="m-cal" class="modal">
        <div class="m-header"><span>選擇日期</span><button class="m-close" onclick="closeModal()">✖</button></div>
        <div class="month-header" style="margin-top:20px;">
            <span onclick="chgCalPicker(-1)">◀</span>
            <span id="txt-cal-month"></span>
            <span onclick="chgCalPicker(1)">▶</span>
        </div>
        <div class="cal-grid" id="ui-cal-grid"></div>
    </div>

    <!-- ===== 圖表 Modal ===== -->
    <div id="m-chart" class="modal">
        <div class="m-header"><span>收支分析</span><button class="m-close" onclick="closeModal()">✖</button></div>
        <div class="form-group" style="text-align:center;"><input type="month" id="c-month" onchange="renderChart()" style="width:70%; font-size:22px; text-align:center; padding:12px;"></div>
        <div class="tabs" id="c-tabs" style="margin-top:0;">
            <div class="tab active exp" data-t="expense" onclick="switchChart('expense')">支出</div>
            <div class="tab inc" data-t="income" onclick="switchChart('income')">收入</div>
            <div class="tab tot" data-t="total" onclick="switchChart('total')">結餘</div>
        </div>
        <div style="background:#fff; margin:0 20px; padding:20px; border-radius:24px; box-shadow:0 6px 16px rgba(0,0,0,.06);">
            <canvas id="c-canvas"></canvas>
        </div>
    </div>

    <!-- ===== 設定 Modal ===== -->
    <div id="m-set" class="modal">
        <div class="m-header"><span>系統設定</span><button class="m-close" onclick="closeModal()">✖</button></div>
        
        <div class="form-group"><label>每月預算 (每月1號自動轉為零用錢)</label><input type="number" id="s-budget" onchange="saveSet()" style="font-family:monospace; font-size:28px; font-weight:900; color:var(--income);"></div>
        
        <button class="btn-big-action" style="background:#fff; color:var(--text-color); border:2px solid #DFE4EA; box-shadow:0 4px 0 #DFE4EA;" onclick="openCatMgr()">🏷️ 分類管理</button>
        <button class="btn-big-action" style="background:#fff; color:var(--text-color); border:2px solid #DFE4EA; box-shadow:0 4px 0 #DFE4EA;" onclick="openAccMgr()">💳 帳戶管理</button>
        
        <div style="margin: 40px 20px 20px; padding-top: 30px; border-top: 2px dashed #DFE4EA;">
            <label style="display:block; font-size:18px; font-weight:900; margin-bottom:15px; text-align:center; color:#7f8fa6;">備份與還原</label>
            <button class="btn-big-action" style="background:var(--primary); color:#fff; box-shadow:0 5px 0 var(--primary-dark);" onclick="openBackupOpt()">📤 備份資料</button>
            <input type="file" id="file-input" accept=".json,.csv" style="display:none;" onchange="impData(event)">
            <button class="btn-big-action" style="background:#fff; color:var(--primary-dark); border:2px solid var(--primary-dark); box-shadow:0 5px 0 var(--primary-dark);" onclick="$('file-input').click()">📥 還原資料</button>
        </div>
    </div>

    <div id="m-backup" class="modal" style="background:rgba(0,0,0,0.5);">
        <div style="background:#fff; position:absolute; bottom:0; width:100%; border-radius:30px 30px 0 0; padding:35px 20px 50px;">
            <h3 style="margin-top:0; text-align:center; font-weight:900; font-size: 22px;">選擇備份格式</h3>
            <button class="btn-big-action" style="background:var(--income); color:#fff; box-shadow:0 5px 0 #189855;" onclick="expData('json')">匯出 JSON (完整還原用)</button>
            <button class="btn-big-action" style="background:#FFA502; color:#fff; box-shadow:0 5px 0 #D35400;" onclick="expData('csv')">匯出 CSV (Excel 閱讀用)</button>
            <button class="btn-big-action" style="background:#f1f2f6; color:#7f8fa6; box-shadow:none; margin-top:25px;" onclick="closeModal()">取消</button>
        </div>
    </div>

    <!-- 分類管理 Modal -->
    <div id="m-cat-mgr" class="modal">
        <div class="m-header"><span>分類管理</span><button class="m-close" onclick="closeModal()">✖</button></div>
        <div class="tabs" id="cat-tabs"><div class="tab active exp" onclick="renderCatMgr('expense')">支出分類</div><div class="tab inc" onclick="renderCatMgr('income')">收入分類</div></div>
        <div id="cat-mgr-container"></div>
        <button class="btn-main btn-record" style="width:calc(100% - 40px); margin:20px; padding:18px; border-radius:18px; font-size:18px;" onclick="addMainCat()">➕ 新增主分類</button>
    </div>

    <!-- 帳戶管理 Modal -->
    <div id="m-acc-mgr" class="modal">
        <div class="m-header"><span>帳戶管理</span><button class="m-close" onclick="closeModal()">✖</button></div>
        <div id="acc-mgr-container"></div>
        <button class="btn-main btn-record" style="width:calc(100% - 40px); margin:20px; padding:18px; border-radius:18px; font-size:18px;" onclick="addAcc()">➕ 新增帳戶</button>
    </div>

    <!-- ===== 虛擬鍵盤 ===== -->
    <div id="v-keypad">
        <button class="key" onclick="kp('7')">7</button><button class="key" onclick="kp('8')">8</button><button class="key" onclick="kp('9')">9</button><button class="key key-op" onclick="kp('del')">刪</button>
        <button class="key" onclick="kp('4')">4</button><button class="key" onclick="kp('5')">5</button><button class="key" onclick="kp('6')">6</button><button class="key key-op" onclick="kp('clear')">C</button>
        <button class="key" onclick="kp('1')">1</button><button class="key" onclick="kp('2')">2</button><button class="key" onclick="kp('3')">3</button><button class="key key-act" onclick="closeKeypad()">完成</button>
        <button class="key" onclick="kp('00')">00</button><button class="key" onclick="kp('0')">0</button><button class="key" onclick="kp('.')">.</button>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz9Tohi--mDE6Pk5u6P20xBiHsQ-yMR1rDmfG5Q7LBmxaOeLxedtHp0iMwh4AuCyt4Ncw/exec";
        
        const defCats = {
            expense: {
                "🍔 食品餐飲": ["營養豆漿", "新鮮水果", "新鮮雞蛋", "早餐花費", "午餐花費", "晚餐花費", "飲料點心", "聚餐交際"],
                "🍽️ 家用飲食": ["小孩早餐", "小孩午餐", "小孩晚餐", "小孩點心", "小孩消夜"],
                "🏠 居家生活": ["日常用品", "水族用品", "汽機用品", "理髮美容", "網路購物", "文具用品", "園藝用品", "郵寄費用"],
                "🛒 家用開銷": ["日常用品", "水族用品", "汽機用品", "理髮美容", "網路購物", "文具用品", "園藝用品", "郵寄費用"],
                "🚗 行車交通": ["台鐵車資", "高鐵車資", "捷運車資", "公車車資", "計程車資", "機車加油", "汽車加油", "停車費用", "共享機車", "公共單車", "洗車費用"],
                "🎮 休閒娛樂": ["幸運樂透", "遊戲投幣", "奢侈敗家", "小賭怡情", "街藝贊助", "電影展覽", "遊戲課金", "國內旅遊", "出國旅遊", "運動健身"],
                "👗 服飾美容": ["衣服鞋包", "保養彩妝", "剪髮造型", "配件飾品"],
                "🏥 醫療保健": ["看診掛號", "按摩保健", "保健食品", "醫美保養", "健身器材"],
                "📚 學習進修": ["書籍雜誌", "線上課程", "實體補習", "技能考試"],
                "🎁 人情往來": ["送禮請客", "孝親支出", "慈善捐款", "獎勵晚軰"],
                "❓ 其他雜項": ["呆帳損失", "教會奉獻"]
            },
            income: {
                "💰 個人收入": ["每月零用", "意外收入", "幸運樂透", "節慶紅包"],
                "💼 工作收入": ["旅費補助", "出差津貼"]
            }
        };

        const getEmoji = str => {
            if (!str) return '';
            try { 
                if (window.Intl && Intl.Segmenter) {
                    return [...new Intl.Segmenter('zh-TW', {granularity: 'grapheme'}).segment(str)][0].segment;
                }
            } catch(e) {}
            return [...str][0]; 
        };

        let db = JSON.parse(localStorage.getItem('cloud_exp_db')) || [];
        let cats = JSON.parse(localStorage.getItem('cloud_exp_cats')) || defCats;
        
        if(!cats.expense['🍽️ 家用飲食']) {
            cats = defCats;
            localStorage.setItem('cloud_exp_cats', JSON.stringify(cats));
        }

        let sets = JSON.parse(localStorage.getItem('cloud_exp_sets')) || { b: 5000, a: ["💵 現金", "🏦 銀行"], l: "" };
        
        let needsUpdate = false;
        if(sets.a.includes('現金') || sets.a.includes('銀行') || sets.a.includes('信用卡')) {
            sets.a = sets.a.filter(x => x !== '信用卡').map(x => x === '現金' ? '💵 現金' : (x === '銀行' ? '🏦 銀行' : x));
            db.forEach(r => {
                if(r.account === '現金') r.account = '💵 現金';
                if(r.account === '銀行') r.account = '🏦 銀行';
                if(r.toAccount === '現金') r.toAccount = '💵 現金';
                if(r.toAccount === '銀行') r.toAccount = '🏦 銀行';
            });
            needsUpdate = true;
        }
        if(!sets.a.length) sets.a = ["💵 現金"];
        if(needsUpdate) saveDB();

        let cDate = new Date(), weekSwipeOffset = 0, rTyp = 'expense', kpStr = '0', chartObj = null, cTyp = 'expense', lStart = '', lEnd = '', calPickDate = new Date(), mgrCatTyp = 'expense';
        let currentInlineDate = "";
        let currentAccFilter = ""; // 帳戶明細過濾狀態

        history.replaceState({ s: 1, t: 'main' }, ''); let curS = 1;
        window.addEventListener('popstate', e => { 
            if(e.state) { 
                curS = e.state.s; 
                if(e.state.t === 'main') closeAll(); 
                else if(e.state.t === 'modal') { $('v-keypad').style.display='none'; $('r-amt-box').classList.remove('active'); $('note-sugg').style.display='none'; } 
            } 
        });
        function pushM(id) { curS++; history.pushState({ s: curS, t: 'modal', id }, ''); }
        function pushK() { if(history.state.t !== 'keypad') { curS++; history.pushState({ s: curS, t: 'keypad' }, ''); } }
        function closeAll() { document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); $('v-keypad').style.display='none'; $('note-sugg').style.display='none'; }
        function closeModal() {
            const visibleModals = [...document.querySelectorAll('.modal')].filter(m => getComputedStyle(m).display !== 'none');
            if (visibleModals.length) visibleModals[visibleModals.length - 1].style.display = 'none';
            $('v-keypad').style.display = 'none';
            $('r-amt-box').classList.remove('active');
            $('note-sugg').style.display = 'none';
            if (history.state && history.state.t !== 'main') history.back();
        }

        const toast = m => { const t=$('toast'); t.innerText=m; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2500); };
        const dStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

        window.onload = () => { 
            setupPWA(); 
            autoPocket(); 
            currentInlineDate = dStr(new Date());
            renderHome();
            initSwipeCalendar();
            if(navigator.onLine && db.some(r=>r.syncStatus==='pending')) {
                toast('發現未同步資料，背景同步中...');
                syncToGAS(false);
            }
        };

        function initSwipeCalendar() {
            let startX = 0;
            const wCal = $('ui-calendar');
            wCal.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
            wCal.addEventListener('touchend', e => {
                let endX = e.changedTouches[0].clientX;
                if(startX - endX > 50) { weekSwipeOffset++; renderHome(); } 
                else if(endX - startX > 50) { weekSwipeOffset--; renderHome(); } 
            });
        }

        let lastAutoBackupAt = 0;
        const AUTO_BACKUP_NOTICE_KEY = 'cloud_exp_auto_backup_notice';

        function autoBackupOnExit() {
            const now = Date.now();
            if (now - lastAutoBackupAt < 2000) return;
            lastAutoBackupAt = now;

            try {
                const n = new Date();
                const ds = `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}_${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}${String(n.getSeconds()).padStart(2,'0')}`;
                const c = JSON.stringify({db, cats, sets});
                const f = `個人雲帳本_自動備份_${ds}.json`;
                const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), c], {type:'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = f;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1500);
                localStorage.removeItem(AUTO_BACKUP_NOTICE_KEY);
            } catch (e) {
                console.error('自動備份失敗：', e);
                try { localStorage.setItem(AUTO_BACKUP_NOTICE_KEY, 'failed'); } catch (_) {}
            }
        }

        function showAutoBackupNoticeIfNeeded() {
            try {
                if (localStorage.getItem(AUTO_BACKUP_NOTICE_KEY) === 'failed') {
                    localStorage.removeItem(AUTO_BACKUP_NOTICE_KEY);
                    toast('⚠️ 自動備份失敗，請到「備份/還原」手動匯出 JSON');
                }
            } catch (_) {
                toast('⚠️ 無法確認自動備份狀態，請手動匯出 JSON 備份');
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                if (navigator.onLine) {
                    const pending = db.filter(r => r.syncStatus === 'pending');
                    if (pending.length > 0) {
                        fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(pending), keepalive:true })
                            .then(r => r.json())
                            .then(r => {
                                if (r.status === 'success' || r.status === 'ok') {
                                    db.forEach(x => { if (x.syncStatus === 'pending') x.syncStatus = 'synced'; });
                                    saveDB();
                                }
                            }).catch(() => {});
                    }
                }
                autoBackupOnExit();
            } else if (document.visibilityState === 'visible') {
                showAutoBackupNoticeIfNeeded();
            }
        });

        window.addEventListener('pagehide', autoBackupOnExit);

        function autoPocket() {
            const mStr = `${cDate.getFullYear()}-${String(cDate.getMonth()+1).padStart(2,'0')}`;
            if (sets.l !== mStr) {
                db.push({ id:'a_'+Date.now(), type:'income', mainCat:'💰 個人收入', subCat:'每月零用', date:`${mStr}-01`, account:sets.a[0], amount:Number(sets.b)||5000, note:'系統自動結轉', syncStatus:'pending' });
                sets.l = mStr; saveDB(); toast(`已自動存入本月預算 $${sets.b}`);
            }
        }

        function renderHome() {
            $('txt-month').innerText = `${cDate.getFullYear()} / ${String(cDate.getMonth()+1).padStart(2,'0')}`;
            
            const cal = $('ui-calendar'); cal.innerHTML = '';
            let d = new Date(cDate); 
            d.setDate(d.getDate() - d.getDay() + (weekSwipeOffset * 7));
            const wk = ['週日','週一','週二','週三','週四','週五','週六'];
            
            let tStr = dStr(new Date());
            if (weekSwipeOffset === 0 && (cDate.getMonth() !== new Date().getMonth() || cDate.getFullYear() !== new Date().getFullYear())) {
                let tempD = new Date(cDate); tempD.setDate(1);
                currentInlineDate = dStr(tempD);
            } else if (weekSwipeOffset === 0 && !currentInlineDate) {
                currentInlineDate = tStr;
            }

            for(let i=0;i<7;i++) {
                let ds = dStr(d), has = db.some(r=>r.date===ds);
                cal.innerHTML += `<div class="day-col ${has?'has-record':''}" onclick="loadInlineList('${ds}')"><span>${wk[i]}</span><div class="day-date">${d.getDate()}</div><div class="day-has-record"></div></div>`;
                d.setDate(d.getDate()+1);
            }

            const mStr = `${cDate.getFullYear()}-${String(cDate.getMonth()+1).padStart(2,'0')}`, yStr = `${cDate.getFullYear()}`;
            let wStart = new Date(); wStart.setDate(wStart.getDate() - wStart.getDay());
            let wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 6);
            
            let dtI=0, dtE=0, dwI=0, dwE=0, dmI=0, dmE=0, dyI=0, dyE=0;

            db.forEach(r => {
                let a = r.amount, rd = new Date(r.date);
                if(r.date === tStr) r.type==='income'?dtI+=a:dtE+=a;
                if(rd>=wStart && rd<=wEnd) r.type==='income'?dwI+=a:dwE+=a;
                if(r.date.startsWith(mStr)) r.type==='income'?dmI+=a:dmE+=a;
                if(r.date.startsWith(yStr)) r.type==='income'?dyI+=a:dyE+=a;
            });

            $('d-inc').innerText = dmI.toLocaleString();$('d-exp').innerText = dmE.toLocaleString();
            
            // 獨立預算邏輯
            let bal = (Number(sets.b) || 5000) - dmE;
            $('d-bal').innerText = bal.toLocaleString();$('d-bal').style.color = bal >= 0 ? 'var(--primary)' : 'var(--expense)';

            $('s-d-today').innerText = tStr; $('s-i-today').innerText=dtI.toLocaleString(); $('s-e-today').innerText=dtE.toLocaleString();$('s-d-week').innerText = `${String(wStart.getMonth()+1).padStart(2,'0')}/${String(wStart.getDate()).padStart(2,'0')}-${String(wEnd.getMonth()+1).padStart(2,'0')}/${String(wEnd.getDate()).padStart(2,'0')}`; $('s-i-week').innerText=dwI.toLocaleString();$('s-e-week').innerText=dwE.toLocaleString();
            $('s-d-month').innerText = mStr; $('s-i-month').innerText=dmI.toLocaleString(); $('s-e-month').innerText=dmE.toLocaleString();$('s-d-year').innerText = yStr; $('s-i-year').innerText=dyI.toLocaleString();$('s-e-year').innerText=dyE.toLocaleString();

            loadInlineList(currentInlineDate);
        }

        function loadInlineList(dateStr) {
            currentInlineDate = dateStr;
            document.querySelectorAll('.day-col').forEach(el => {
                if(el.getAttribute('onclick').includes(dateStr)) el.classList.add('day-today');
                else el.classList.remove('day-today');
            });
            $('ui-inline-title').innerText = `📝 ${dateStr.replace(/-/g, '/')} 明細`;
            const tl = $('ui-today-list');
            const tr = db.filter(r=>r.date===dateStr).reverse();
            tl.innerHTML = tr.length ? tr.map(r => rHtml(r)).join('') : '<div style="text-align:center;padding:40px;color:#95a5a6;font-weight:900;font-size:20px;">該日尚無紀錄</div>';
        }

        function rHtml(r) {
            let i = r.type==='expense', t = r.type==='transfer';
            let cls = i?'exp':(t?'tra':'inc');
            let col = i ? 'var(--expense)' : (t ? 'var(--transfer)' : 'var(--primary)');
            let pre = i ? '-' : (t ? '' : '+');
            
            let emoji = getEmoji(r.mainCat);
            let mStr = t ? `轉至：${r.toAccount}` : `${r.mainCat} - ${emoji} ${r.subCat}`;
            
            return `
            <div class="record-item ${cls}">
                <div class="r-header">
                    <div class="r-date">${r.date} · ${r.account} ${r.syncStatus==='pending'?'⏳':''}</div>
                    <button class="del-btn" onclick="delRec('${r.id}')">刪除</button>
                </div>
                <div class="r-cat">${mStr}</div>
                ${r.note ? `<div class="r-sub">${r.note}</div>` : ''}
                <div class="r-amt" style="color:${col}">${pre}$${r.amount.toLocaleString()}</div>
            </div>`;
        }

        function chgMth(d) { 
            cDate.setMonth(cDate.getMonth()+d); 
            weekSwipeOffset = 0; 
            renderHome(); 
        }

        function openRecord() {
            rTyp = 'expense'; kpStr = '0'; $('r-amt').innerText='0';
            $('r-date').value=dStr(new Date());$('r-note').value='';
            const opts = sets.a.map(a=>`<option value="${a}">${a}</option>`).join('');
            $('r-acc').innerHTML = opts; $('r-acc-out').innerHTML = opts; $('r-acc-in').innerHTML = opts;
            $('note-sugg').style.display = 'none';
            updRT(); loadMainCat(); updBal(); $('m-record').style.display='block'; pushM('m-record');
        }

        $('r-tabs').addEventListener('click', e => { 
            if(e.target.dataset.t) { 
                rTyp = e.target.dataset.t; 
                updRT(); 
                loadMainCat(); 
            } 
        });
        
        function updRT() {
            document.querySelectorAll('#r-tabs .tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`#r-tabs .tab[data-t="${rTyp}"]`).classList.add('active');
            
            if(rTyp === 'transfer') { 
                $('r-area-cat').style.display='none'; 
                $('r-area-tra').style.display='flex';$('r-acc-container').style.display='none'; 
            } else { 
                $('r-area-cat').style.display='flex'; 
                $('r-area-tra').style.display='none';$('r-acc-container').style.display='block'; 
            }
        }

        function handleNoteInput(val) {
            let box = $('note-sugg');
            let q = val.trim();
            if(!q) { box.style.display = 'none'; return; }
            let historyNotes = [...new Set(db.map(r => r.note).filter(n => n))];
            let matched = historyNotes.filter(n => n.includes(q) && n !== q);
            if(matched.length > 0) {
                box.innerHTML = matched.map(m => `<div class="ac-item" onclick="setNote('${m}')">${m}</div>`).join('');
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }
        
        function setNote(val) {
            $('r-note').value = val;
            $('note-sugg').style.display = 'none';
        }

        function loadMainCat() {
            if(rTyp==='transfer') return;
            let opts = Object.keys(cats[rTyp]).map(c=>`<option value="${c}">${c}</option>`);
            opts.push('<option value="_ADD_">➕ 新增分類...</option>');
            $('r-mcat').innerHTML = opts.join(''); loadSubCat();
        }
        
        function loadSubCat() {
            const m = $('r-mcat').value;
            if(m === '_ADD_') { checkNewCat($('r-mcat'), true); return; }
            if(m && cats[rTyp][m]) {
                let emoji = getEmoji(m);
                $('r-scat').innerHTML = cats[rTyp][m].map(c=>`<option value="${c}">${emoji} ${c}</option>`).join('') + '<option value="_ADD_">➕ 新增分類...</option>';
            }
        }
        
        function checkNewCat(el, isMain = false) {
            if(el.value==='_ADD_') {
                let n = prompt(`輸入新${isMain?'主':'子'}分類名稱 (支援 Emoji)：`);
                if(n && n.trim()) { 
                    n = n.trim();
                    if(isMain) { cats[rTyp][n] = ["一般"]; saveDB(); loadMainCat(); $('r-mcat').value = n; loadSubCat(); }
                    else { cats[rTyp][$('r-mcat').value].push(n); saveDB(); loadSubCat(); el.value = n; }
                } else { if(isMain) loadMainCat(); else loadSubCat(); }
            }
        }
        
        function updBal() {
            let acc = $('r-acc').value, b = 0;
            db.forEach(r=>{ if(r.account===acc) { if(r.type==='income')b+=r.amount; else b-=r.amount; } if(r.type==='transfer' && r.toAccount===acc) b+=r.amount; });
            $('r-bal').innerText = `餘額: $${b.toLocaleString()}`;
            $('r-bal').style.color = b >= 0 ? 'var(--primary)' : 'var(--expense)';
        }

        function openKeypad() { $('v-keypad').style.display='grid';$('r-amt-box').classList.add('active'); pushK(); }
        function closeKeypad() { if(history.state.t==='keypad') history.back(); else { $('v-keypad').style.display='none';$('r-amt-box').classList.remove('active'); } }
        function kp(v) {
            if(v==='clear') kpStr='0'; else if(v==='del') kpStr=kpStr.length>1?kpStr.slice(0,-1):'0';
            else { if(kpStr==='0'&&v!=='.') kpStr=v; else kpStr+=v; if(kpStr.length>10) kpStr=kpStr.slice(0,10); }
            $('r-amt').innerText = Number(kpStr).toLocaleString();
        }

        function saveRec() {
            let a = Number(kpStr); if(a<=0) return toast('金額需大於0');
            let rec = { id:'c_'+Date.now(), type:rTyp, date:$('r-date').value, amount:a, note:$('r-note').value.trim(), syncStatus:'pending' };
            if(rTyp==='transfer') { rec.account = $('r-acc-out').value; rec.toAccount =$('r-acc-in').value; if(rec.account===rec.toAccount) return toast('轉出與轉入不可相同'); }
            else { rec.mainCat=$('r-mcat').value; rec.subCat=$('r-scat').value; rec.account=$('r-acc').value; }
            db.push(rec); saveDB(); toast('✅ 已儲存'); closeKeypad(); closeModal(); renderHome();
        }
        
        function delRec(id) { if(confirm('確定刪除？')) { db = db.filter(r=>r.id!==id); saveDB(); renderHome(); if($('m-list').style.display==='block') renderListModal(); } }

        function openGlobalSearch() {
            lStart = '1970-01-01'; lEnd = '2099-12-31';
            currentAccFilter = ''; // 重置帳戶過濾
            $('l-title').innerText = '🔍 萬用搜尋';
            $('l-search').value = '';
            renderListModal();
            $('m-list').style.display = 'block';
            pushM('m-list');
            setTimeout(() => $('l-search').focus(), 100);
        }

        function openList(mode, p1) {
            $('l-search').value = '';
            currentAccFilter = ''; 
            let n = new Date(), t = dStr(n);
            
            if(mode==='date') { lStart = p1; lEnd = p1; $('l-title').innerText=`明細 (${p1})`; }
            else if(mode==='today') { lStart = t; lEnd = t; $('l-title').innerText='本日明細'; }
            else if(mode==='week') { let s=new Date(n); s.setDate(s.getDate()-s.getDay()); let e=new Date(s); e.setDate(e.getDate()+6); lStart=dStr(s); lEnd=dStr(e); $('l-title').innerText='本週明細'; }
            else if(mode==='month') { lStart=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`; lEnd=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-31`; $('l-title').innerText='本月明細'; }
            else if(mode==='year') { lStart=`${n.getFullYear()}-01-01`; lEnd=`${n.getFullYear()}-12-31`; $('l-title').innerText='本年明細'; }
            else if(mode==='account') { 
                lStart = '1970-01-01'; lEnd = '2099-12-31'; 
                $('l-title').innerText = `💳 ${p1} 明細`; 
                currentAccFilter = p1; 
            }
            
            renderListModal(); $('m-list').style.display='block'; pushM('m-list');
        }

        function renderListModal() {
            let kw = $('l-search').value.toLowerCase();
            let arr = db.filter(r => {
                if(r.date < lStart || r.date > lEnd) return false;
                
                if(currentAccFilter && r.account !== currentAccFilter && r.toAccount !== currentAccFilter) return false;
                
                if(kw) { let txt = (r.mainCat||'')+(r.subCat||'')+(r.note||'')+(r.account||'')+(r.amount); return txt.toLowerCase().includes(kw); } return true;
            }).reverse();
            $('l-container').innerHTML = arr.length ? arr.map(r=>rHtml(r)).join('') : '<div style="text-align:center;padding:50px;color:#95a5a6;font-weight:900;font-size:20px;">查無資料</div>';
        }

        function openCalPicker() { calPickDate = new Date(cDate); renderCalPicker(); $('m-cal').style.display='block'; pushM('m-cal'); }
        function chgCalPicker(d) { calPickDate.setMonth(calPickDate.getMonth()+d); renderCalPicker(); }
        function renderCalPicker() {
            $('txt-cal-month').innerText = `${calPickDate.getFullYear()} / ${String(calPickDate.getMonth()+1).padStart(2,'0')}`;
            let y = calPickDate.getFullYear(), m = calPickDate.getMonth();
            let firstDay = new Date(y, m, 1).getDay(), daysInM = new Date(y, m+1, 0).getDate();
            let html = '<div class="cal-head">日</div><div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div><div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head">六</div>';
            for(let i=0; i<firstDay; i++) html += '<div></div>';
            let tStr = dStr(new Date());
            for(let i=1; i<=daysInM; i++) {
                let ds = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                let has = db.some(r=>r.date===ds), isT = (ds===tStr);
                html += `<div class="cal-cell ${has?'has-rec':''} ${isT?'today':''}" onclick="closeModal(); weekSwipeOffset=0; cDate = new Date('${ds}'); renderHome(); loadInlineList('${ds}')">${i}</div>`;
            }
            $('ui-cal-grid').innerHTML = html;
        }

        function openChart(type) {
            $('c-month').value = `${cDate.getFullYear()}-${String(cDate.getMonth()+1).padStart(2,'0')}`;
            cTyp = type || 'expense'; $('m-chart').style.display='block'; pushM('m-chart'); renderChart();
        }
        function switchChart(t) { cTyp=t; renderChart(); }
        
        function renderChart() {
            document.querySelectorAll('#c-tabs .tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`#c-tabs .tab[data-t="${cTyp}"]`).classList.add('active');
            
            let mStr = $('c-month').value; if(!mStr) return;
            
            let dt = {}, ti=0, te=0;
            db.forEach(r=>{
                if(r.date.startsWith(mStr)) {
                    if(r.type==='income') ti+=r.amount; if(r.type==='expense') te+=r.amount;
                    if(r.type===cTyp) dt[r.mainCat] = (dt[r.mainCat]||0) + r.amount;
                }
            });

            if(chartObj) chartObj.destroy();
            const ctx = $('c-canvas').getContext('2d');
            Chart.defaults.font.size = 18;
            
            let expColors = ['#FF4757', '#FF6B81', '#FF9F43', '#EE5A24', '#EA2027', '#B33939', '#CD6133'];
            let incColors = ['#00A8FF', '#48DBFB', '#0984E3', '#74B9FF', '#1E90FF', '#3742FA', '#5352ED'];

            if(cTyp==='total') {
                chartObj = new Chart(ctx, { type:'bar', data: { labels:['收入', '支出', '結餘'], datasets:[{ data:[ti, te, ti-te], backgroundColor:['#00A8FF', '#FF4757', '#20BF6B'], borderRadius:16 }] }, options: { plugins:{legend:{display:false}} } });
            } else {
                let lbl = Object.keys(dt), val = Object.values(dt);
                let currentColors = (cTyp === 'expense') ? expColors : incColors;
                
                if(!lbl.length) chartObj = new Chart(ctx, { type:'doughnut', data:{labels:['無資料'],datasets:[{data:[1],backgroundColor:['#DFE4EA']}]} });
                else chartObj = new Chart(ctx, { type:'doughnut', data:{labels:lbl,datasets:[{data:val,backgroundColor:currentColors,borderWidth:0}]}, options:{cutout:'65%',plugins:{legend:{position:'bottom'}}} });
            }
        }

        function openSettings() { $('s-budget').value=sets.b; $('m-set').style.display='block'; pushM('m-set'); }
        function saveSet() { sets.b=Number($('s-budget').value)||5000; saveDB(); toast('設定已儲存'); renderHome(); }
        
        function openAccMgr() { renderAccMgr(); $('m-acc-mgr').style.display='block'; pushM('m-acc-mgr'); }
        
        function renderAccMgr() {
            let accBals = {}; sets.a.forEach(a => accBals[a] = 0);
            db.forEach(r => {
                let a = r.amount;
                if(r.type === 'income' && accBals[r.account] !== undefined) accBals[r.account] += a;
                if(r.type === 'expense' && accBals[r.account] !== undefined) accBals[r.account] -= a;
                if(r.type === 'transfer') {
                    if(accBals[r.account] !== undefined) accBals[r.account] -= a;
                    if(accBals[r.toAccount] !== undefined) accBals[r.toAccount] += a;
                }
            });
            
            $('acc-mgr-container').innerHTML = sets.a.map(a => {
                let bal = accBals[a] || 0;
                let balColor = bal >= 0 ? 'var(--primary)' : 'var(--expense)';
                
                return `<div class="mgr-card" onclick="openList('account', '${a}')" style="cursor:pointer; transition: transform 0.1s;">
                    <div class="mgr-title">
                        <span>💳 ${a} <span style="color:${balColor}; font-size:18px; margin-left:8px;">($${bal.toLocaleString()})</span></span>
                        <span class="mgr-del" onclick="event.stopPropagation(); delAcc('${a}')">刪除</span>
                    </div>
                </div>`;
            }).join('');
        }

        function addAcc() { let n = prompt('輸入新帳戶名稱：'); if(n&&n.trim()&&!sets.a.includes(n.trim())){ sets.a.push(n.trim()); saveDB(); renderAccMgr(); renderHome(); } }
        function delAcc(a) { 
            let used = db.some(r=>r.account===a || r.toAccount===a);
            if(used && !confirm('此帳戶已有歷史紀錄，刪除不影響過去帳目，確定刪除？')) return;
            sets.a = sets.a.filter(x=>x!==a); if(!sets.a.length) sets.a=['💵 現金']; saveDB(); renderAccMgr(); renderHome();
        }

        function openCatMgr() { mgrCatTyp = 'expense'; renderCatMgr('expense'); $('m-cat-mgr').style.display='block'; pushM('m-cat-mgr'); }
        
        function renderCatMgr(typ) {
            mgrCatTyp = typ;
            document.querySelectorAll('#cat-tabs .tab').forEach(t=>t.className='tab '+(t.classList.contains('exp')?'exp':'inc'));
            document.querySelector(`#cat-tabs .tab.${typ==='expense'?'exp':'inc'}`).classList.add('active');
            let html = '';
            for(let m in cats[typ]) {
                let emoji = getEmoji(m);
                let subs = cats[typ][m].map(s=>`<div class="mgr-chip">${emoji} ${s} <span class="mgr-del" onclick="delSubCat('${typ}','${m}','${s}')">✖</span></div>`).join('');
                html += `<div class="mgr-card"><div class="mgr-title"><span>${m}</span><div><span class="mgr-del" style="color:var(--primary);" onclick="addSubCat('${typ}','${m}')">➕</span> <span class="mgr-del" onclick="delMainCat('${typ}','${m}')">🗑️</span></div></div><div>${subs}</div></div>`;
            }
            $('cat-mgr-container').innerHTML = html;
        }
        
        function addMainCat() { let n=prompt('輸入新主分類：'); if(n&&n.trim()){ cats[mgrCatTyp][n.trim()]=["一般"]; saveDB(); renderCatMgr(mgrCatTyp); } }
        function addSubCat(t, m) { let n=prompt(`在「${m}」新增子分類：`); if(n&&n.trim()){ cats[t][m].push(n.trim()); saveDB(); renderCatMgr(t); } }
        function delMainCat(t, m) { let u=db.some(r=>r.type===t&&r.mainCat===m); if(u&&!confirm('此分類已有紀錄，確定刪除？'))return; delete cats[t][m]; saveDB(); renderCatMgr(t); }
        function delSubCat(t, m, s) { let u=db.some(r=>r.type===t&&r.mainCat===m&&r.subCat===s); if(u&&!confirm('此子分類已有紀錄，確定刪除？'))return; cats[t][m]=cats[t][m].filter(x=>x!==s); saveDB(); renderCatMgr(t); }

        function openBackupOpt() { $('m-backup').style.display='block'; pushM('m-backup'); }
        function expData(t) {
            let url = '';
            try {
                const n=new Date(), ds=`${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}_${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}`;
                let c='', f='', m='';
                if(t==='json') { c=JSON.stringify({db,cats,sets}); f=`個人雲帳本_${ds}.json`; m='application/json'; }
                else { c="系統ID,日期,類型,大分類,小分類,轉出帳戶,轉入帳戶,金額,備註\n"; db.forEach(r=>{ let tStr=r.type==='expense'?'支出':(r.type==='income'?'收入':'轉帳'); c+=`${r.id},${r.date},${tStr},${r.mainCat||''},${r.subCat||''},${r.account},${r.toAccount||''},${r.amount},${r.note||''}\n`; }); f=`個人雲帳本_${ds}.csv`; m='text/csv'; }
                const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), c], {type:m});
                url = URL.createObjectURL(blob);
                const a=document.createElement('a'); a.href=url; a.download=f; a.style.display='none';
                document.body.appendChild(a); a.click(); a.remove();
                closeModal();
                toast(t==='json' ? '✅ 已開始匯出 JSON 備份，請確認下載資料夾' : '✅ 已開始匯出 CSV，請確認下載資料夾');
                setTimeout(() => URL.revokeObjectURL(url), 1500);
            } catch (err) {
                console.error('匯出失敗：', err);
                closeModal();
                toast('⚠️ 匯出失敗，請再試一次');
                if (url) setTimeout(() => URL.revokeObjectURL(url), 1500);
            }
        }
        function impData(e) {
            const f=e.target.files[0]; if(!f) return; const r=new FileReader();
            r.onload = ev => { try{ let d=JSON.parse(ev.target.result); if(d.db){ db=d.db; if(d.cats)cats=d.cats; if(d.sets)sets=d.sets; saveDB(); alert('還原成功！'); window.location.reload(); }else alert('檔案格式不符'); }catch(err){alert('讀取失敗，僅支援 JSON 還原');} }; r.readAsText(f);
        }

        async function syncToGAS(showUI = false) {
            if(!navigator.onLine) return showUI ? toast('無網路連線，下次將自動同步') : null;
            let p = db.filter(r=>r.syncStatus==='pending'); if(!p.length) return showUI ? toast('已是最新狀態') : null;
            
            let b = $('btn-sync'), ot = b.innerHTML; 
            b.innerHTML='🔄 同步中'; b.style.pointerEvents='none';
            try {
                const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p) });
                const r = await res.json();
                if(r.status==='success'||r.status==='ok') { db.forEach(x=>{if(x.syncStatus==='pending')x.syncStatus='synced';}); saveDB(); if(showUI) toast(`成功同步 ${p.length} 筆資料至雲端`); renderHome(); } else throw new Error();
            } catch(e) { if(showUI) toast('同步失敗，稍後將自動重試'); } finally { b.innerHTML=ot; b.style.pointerEvents='auto'; }
        }

        function saveDB() { localStorage.setItem('cloud_exp_db',JSON.stringify(db)); localStorage.setItem('cloud_exp_cats',JSON.stringify(cats)); localStorage.setItem('cloud_exp_sets',JSON.stringify(sets)); }
        
        function setupPWA() {
            const iconUrl = new URL('icon.png', window.location.href).href;
            
            const m = { 
                name: "個人雲帳本", 
                short_name: "個人雲帳本", 
                display: "standalone", 
                background_color: "#F2F5F8", 
                theme_color: "#F39C12", 
                icons: [
                    { src: iconUrl, sizes: "192x192", type: "image/png" },
                    { src: iconUrl, sizes: "512x512", type: "image/png" }
                ], 
                start_url: window.location.href 
            };
            const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/json' })); document.head.appendChild(l);
        }
        let defPrompt; window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); defPrompt = e; });
        function handleInstall() { if (defPrompt) { defPrompt.prompt(); defPrompt.userChoice.then(() => { defPrompt = null; $('install-btn').style.display = 'none'; }); } else { alert('您的裝置已安裝，或請點擊瀏覽器選單「加到主畫面」'); } }
    </script>
</body>
